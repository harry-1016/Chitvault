function toFS(obj){
  const f={};
  for(const[k,v]of Object.entries(obj)){
    if(v===null||v===undefined)f[k]={nullValue:null};
    else if(typeof v==="boolean")f[k]={booleanValue:v};
    else if(typeof v==="number")f[k]={integerValue:String(v)};
    else if(typeof v==="string")f[k]={stringValue:v};
    else if(Array.isArray(v))f[k]={arrayValue:{values:v.map(i=>({stringValue:String(i)}))}};
    else f[k]={stringValue:JSON.stringify(v)};
  }
  return{fields:f};
}
function fromFS(doc){
  if(!doc.fields)return{};
  const obj={_id:doc.name?.split("/").pop()};
  for(const[k,v]of Object.entries(doc.fields)){
    if(v.stringValue!==undefined)obj[k]=v.stringValue;
    else if(v.integerValue!==undefined)obj[k]=Number(v.integerValue);
    else if(v.doubleValue!==undefined)obj[k]=Number(v.doubleValue);
    else if(v.booleanValue!==undefined)obj[k]=v.booleanValue;
    else if(v.nullValue!==undefined)obj[k]=null;
    else if(v.arrayValue)obj[k]=(v.arrayValue.values||[]).map(i=>i.stringValue||"");
    else obj[k]=null;
  }
  return obj;
}

// ── Online Status ──────────────────────────────────────────────────────────────
function useOnlineStatus(){
  const[isOnline,set]=useState(navigator.onLine);
  useEffect(()=>{const on=()=>set(true),off=()=>set(false);window.addEventListener("online",on);window.addEventListener("offline",off);return()=>{window.removeEventListener("online",on);window.removeEventListener("offline",off)};},[]);
  return isOnline;
}

// ── LOGIN ──────────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const[username,setUsername]=useState("");

  const[loading,setLoading]=useState(false);

    setLoading(true);setError("");
    try{
      const data=await firebaseAuth.signIn(toEmail(username),password);
      onLogin({uid:data.localId,idToken:data.idToken,username,isOwner:username.toLowerCase()==="harikrishna"});
    }catch(e){setError(e.message.includes("INVALID")||e.message.includes("EMAIL")?"Invalid username or password":e.message);}

          <h2 style={{fontSize:16,fontWeight:800,marginBottom:20,color:G.textSecondary}}>Sign In to Continue</h2>

// ── WHATSAPP REMINDERS ────────────────────────────────────────────────────────
function WAReminders({members,showToast}){
  const[sentLog,setSentLog]=useState([]);
  const[loading,setLoading]=useState("");
  const send=(type,m)=>{
    const key=`${type}-${m._id}`;setLoading(key);
    const mo=new Date().toLocaleString("en-IN",{month:"long",year:"numeric"});
    const msgs={due:wa.due(m.name,m.group,m.monthlyAmount||5000,mo),overdue:wa.overdue(m.name,m.group,(Number(m.pending)*Number(m.monthlyAmount||5000)),m.pending),auction:wa.auction(m.name,m.group,"15th "+mo)};
    wa.send(m.mobile,msgs[type]);
    setTimeout(()=>{setSentLog(p=>[...p,key]);setLoading("");showToast(`WhatsApp opened for ${m.name}`);},500);
  };
  return(
    <div className="page-enter">
      <div style={{marginBottom:16}}><h2 style={{fontSize:22,fontWeight:800}}>WhatsApp Reminders</h2><p style={{color:G.textSecondary,fontSize:13}}>Send payment reminders</p></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:12,marginBottom:16}}>
        {[{id:"due",label:"Due Reminder",color:G.blue,emoji:"⏰"},{id:"overdue",label:"Overdue Alert",color:G.red,emoji:"🚨"},{id:"auction",label:"Auction Notice",color:G.purple,emoji:"🔔"}].map(t=>(
          <Card key={t.id} style={{borderTop:`3px solid ${t.color}`,padding:14,textAlign:"center"}}>
            <div style={{fontSize:24,marginBottom:6}}>{t.emoji}</div>
            <p style={{fontWeight:700,fontSize:12,marginBottom:8}}>{t.label}</p>
            <Btn small variant="whatsapp" onClick={()=>members.forEach((m,i)=>setTimeout(()=>send(t.id,m),i*300))} style={{width:"100%",justifyContent:"center",fontSize:11}}>All ({members.length})</Btn>
          </Card>
        ))}
      </div>
      <Card>
        <h3 style={{fontWeight:700,fontSize:13,marginBottom:14,color:G.textSecondary}}>INDIVIDUAL SEND</h3>
        {members.length===0&&<p style={{color:G.textMuted,fontSize:13}}>No members yet</p>}
        {members.map(m=>(
          <div key={m._id} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 0",borderBottom:`1px solid ${G.border}`}}>
            <div style={{width:36,height:36,borderRadius:9,background:G.accentSoft,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,color:G.accent,flexShrink:0}}>{m.name?.[0]?.toUpperCase()}</div>
            <div style={{flex:1,minWidth:0}}><p style={{fontWeight:700,fontSize:13}}>{m.name}</p><p style={{fontSize:11,color:G.textSecondary}}>{m.mobile}</p></div>
            <div style={{display:"flex",gap:4}}>
              {["due","overdue","auction"].map(type=>{const key=`${type}-${m._id}`;const sent=sentLog.includes(key);return(<Btn key={type} small variant={sent?"success":"whatsapp"} loading={loading===key} onClick={()=>send(type,m)}>{sent?"✓":type==="due"?"⏰":type==="overdue"?"🚨":"🔔"}</Btn>);})}
            </div>
          </div>
        ))}
      </Card>
    </div>
  );
}

      <div style={{marginBottom:16}}><h2 style={{fontSize:22,fontWeight:800}}>Reports</h2><p style={{color:G.textSecondary,fontSize:13}}>Financial analytics</p></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:14}}>
        <Card>
          <h3 style={{fontWeight:700,fontSize:13,color:G.textSecondary,marginBottom:14}}>GROUP PERFORMANCE</h3>
          {groups.length===0&&<p style={{color:G.textMuted,fontSize:13}}>No groups yet</p>}
          {groups.map(g=>{const tot=Number(g.amount)*Number(g.duration)*Number(g.members);const pct=tot>0?Math.min(100,(Number(g.collected||0)/tot)*100):0;return(<div key={g._id} style={{marginBottom:14}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontWeight:700,fontSize:13}}>{g.name}</span><span style={{fontSize:12,color:G.textSecondary}}>₹{Number(g.collected||0).toLocaleString("en-IN")}</span></div><div style={{height:6,background:G.border,borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${G.accent},${G.blue})`,borderRadius:3}}/></div><p style={{fontSize:10,color:G.textMuted,marginTop:2}}>{pct.toFixed(1)}% of target</p></div>);})}
        </Card>
        <Card>
          <h3 style={{fontWeight:700,fontSize:13,color:G.textSecondary,marginBottom:14}}>SUMMARY</h3>
          {[["Total Groups",groups.length,G.accent],["Total Members",members.length,G.blue],["Active Members",active,G.accent],["Defaulters",def.length,G.red],["Total Collected",`₹${total.toLocaleString("en-IN")}`,G.accent]].map(([k,v,c])=>(
            <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${G.border}`}}>
              <span style={{fontSize:13,color:G.textSecondary}}>{k}</span>
              <span style={{fontWeight:800,color:c,fontFamily:"'JetBrains Mono',monospace"}}>{v}</span>
            </div>
          ))}
        </Card>
      </div>
    </div>
  );
}

// ── USER MANAGER (Owner Only) ─────────────────────────────────────────────────
function UserManager({idToken,showToast}){
  const[users,setUsers]=useState([]);
  const[modal,setModal]=useState(false);
  const[loading,setLoading]=useState(false);
  const[fetching,setFetching]=useState(true);
  const[form,setForm]=useState({username:"",password:"",role:"collector",mobile:""});
  useEffect(()=>{db.getAll("app_users",idToken).then(d=>{setUsers(d);setFetching(false);});},[idToken]);
  const toEmail=u=>`${u.toLowerCase().replace(/\s+/g,"")}@chitvault.app`;
  const createUser=async()=>{
    if(!form.username||!form.password){showToast("Username and password required","error");return;}
    if(form.password.length<6){showToast("Password min 6 characters","error");return;}
    setLoading(true);
    try{
      const email=toEmail(form.username);
      await firebaseAuth.createUser(email,form.password);
      const doc=await db.add("app_users",{username:form.username,email,role:form.role,mobile:form.mobile,createdAt:new Date().toISOString(),active:"true"},idToken);
      setUsers(p=>[...p,doc]);setModal(false);setForm({username:"",password:"",role:"collector",mobile:""});showToast(`User ${form.username} created!`);
    }catch(e){showToast(e.message.includes("EMAIL_EXISTS")?"Username already taken":e.message,"error");}
    setLoading(false);
  };
  const deleteUser=async u=>{
    if(!window.confirm(`Delete user ${u.username}?`))return;
    await db.delete("app_users",u._id,idToken);setUsers(p=>p.filter(x=>x._id!==u._id));showToast(`User ${u.username} removed`);
  };
  return(
    <div className="page-enter">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div><h2 style={{fontSize:22,fontWeight:800}}>User Manager</h2><p style={{color:G.textSecondary,fontSize:13}}>Create staff login credentials</p></div>
        <Btn onClick={()=>setModal(true)}>+ Create User</Btn>
      </div>
      <div style={{background:G.goldSoft,border:`1px solid ${G.gold}33`,borderRadius:12,padding:"12px 16px",marginBottom:16,fontSize:12,color:G.gold}}>👑 Owner access only</div>
      {fetching?<div style={{display:"flex",justifyContent:"center",padding:40}}><Spinner size={32}/></div>:(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <Card style={{padding:"14px 16px",background:G.goldSoft}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:38,height:38,borderRadius:9,background:`${G.gold}22`,border:`1px solid ${G.gold}44`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:15,color:G.gold}}>H</div>
              <div style={{flex:1}}><p style={{fontWeight:700,fontSize:14}}>harikrishna</p><p style={{fontSize:11,color:G.textMuted}}>harikrishna@chitvault.app</p></div>
              <Badge color={G.gold}>👑 Owner</Badge>
            </div>
          </Card>
          {users.length===0&&<Card><p style={{color:G.textMuted,textAlign:"center",fontSize:13}}>No staff users yet. Add your first!</p></Card>}
          {users.map(u=>(
            <Card key={u._id} style={{padding:"14px 16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <div style={{width:38,height:38,borderRadius:9,background:G.accentSoft,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:15,color:G.accent}}>{u.username?.[0]?.toUpperCase()}</div>
                <div style={{flex:1,minWidth:0}}>
                  <p style={{fontWeight:700,fontSize:14}}>{u.username}</p>
                  <p style={{fontSize:11,color:G.textSecondary}}>{u.email} {u.mobile&&`· ${u.mobile}`}</p>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                  <Badge color={u.role==="manager"?G.purple:G.blue}>{u.role}</Badge>
                  <Btn small variant="danger" onClick={()=>deleteUser(u)}>✕</Btn>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}
      <Modal open={modal} onClose={()=>setModal(false)} title="Create New User">
        <Input label="Username" value={form.username} onChange={v=>setForm({...form,username:v})} placeholder="e.g. ramu_collector" required/>
        <Input label="Password" type="password" value={form.password} onChange={v=>setForm({...form,password:v})} placeholder="Minimum 6 characters" required/>
        <Select label="Role" value={form.role} onChange={v=>setForm({...form,role:v})} options={[{value:"collector",label:"Collector — can record payments"},{value:"manager",label:"Manager — full access"},{value:"viewer",label:"Viewer — read only"}]}/>
        <Input label="Mobile (Optional)" value={form.mobile} onChange={v=>setForm({...form,mobile:v})} placeholder="9XXXXXXXXX"/>
        <div style={{display:"flex",gap:10,marginTop:6}}>
          <Btn onClick={createUser} loading={loading} style={{flex:1,justifyContent:"center"}}>Create User</Btn>
          <Btn variant="ghost" onClick={()=>setModal(false)} style={{flex:1,justifyContent:"center"}}>Cancel</Btn>
        </div>
      </Modal>
    </div>
  );
}

// ── APP SHELL ─────────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[page,setPage]=useState("dashboard");
  const[groups,setGroups]=useState([]);
  const[members,setMembers]=useState([]);
  const[collections,setCollections]=useState([]);
  const[dataLoading,setDataLoading]=useState(false);
  const[toast,setToast]=useState({msg:"",type:"success"});
  const isOnline=useOnlineStatus();
  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"success"}),3500);};

  const onLogin=async userData=>{
    setUser(userData);setDataLoading(true);
    try{
      const[g,m,c]=await Promise.all([db.getAll("groups",userData.idToken),db.getAll("members",userData.idToken),db.getAll("collections",userData.idToken)]);
      setGroups(g);setMembers(m);setCollections(c.sort((a,b)=>b.createdAt?.localeCompare(a.createdAt||"")||0));
    }catch(e){showToast("Could not load data — check Firestore rules","error");}
    setDataLoading(false);
  };

  if(!user)return<Login onLogin={onLogin}/>;

  const sp={idToken:user.idToken,showToast};
  const pages={
    dashboard:<Dashboard groups={groups} members={members} collections={collections}/>,
    groups:<Groups groups={groups} setGroups={setGroups} {...sp}/>,
    members:<Members members={members} setMembers={setMembers} groups={groups} {...sp}/>,
    collections:<Collections collections={collections} setCollections={setCollections} members={members} groups={groups} {...sp}/>,
    receipts:<Receipts collections={collections} showToast={showToast}/>,
    reminders:<WAReminders members={members} showToast={showToast}/>,
    reports:<Reports groups={groups} members={members} collections={collections}/>,
    users:<UserManager {...sp}/>,
  };

  return(
    <>
      <Toast msg={toast.msg} type={toast.type}/>
      {!isOnline&&<div style={{position:"fixed",top:0,left:0,right:0,zIndex:9998,background:G.red,color:"#fff",textAlign:"center",padding:"8px",fontSize:13,fontWeight:700}}>⚠ Offline — Firebase sync paused</div>}
      <Sidebar page={page} setPage={setPage} user={user} onLogout={()=>setUser(null)}/>
      <BottomNav page={page} setPage={setPage} user={user} onLogout={()=>setUser(null)}/>
      <main className="main-content" style={{marginLeft:220,minHeight:"100vh",padding:"24px 28px",transition:"margin-left 0.25s"}}>
        <div style={{maxWidth:1100}}>
          {dataLoading?(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"60vh",gap:16}}>
              <Spinner size={40}/><p style={{color:G.textSecondary}}>Loading from Firebase...</p>
            </div>
          ):pages[page]}
        </div>
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
  <script>
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
  </script>
</body>
</html>
