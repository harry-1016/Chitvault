<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#00D4AA"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="ChitVault"/>
  <link rel="manifest" href="manifest.json"/>
  <title>ChitVault</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;min-height:100vh}
    body{background:#070B12;color:#E8EDF5;font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden}
    input,select,textarea,button{font-family:'Plus Jakarta Sans',sans-serif;outline:none}
    button{cursor:pointer}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    .fade{animation:fadeIn 0.25s ease forwards}
    .spin{animation:spin 0.8s linear infinite}

    /* App shell */
    .app-shell{display:flex;height:100vh;overflow:hidden}
    .sidebar{width:210px;flex-shrink:0;background:#0F1520;border-right:1px solid #1E2D45;display:flex;flex-direction:column;overflow:hidden}
    .page-area{flex:1;overflow-y:auto;padding:20px 22px 24px;background:#070B12}

    /* Bottom nav */
    .bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:#0F1520;border-top:1px solid #1E2D45;z-index:200;padding:4px 0 env(safe-area-inset-bottom,6px)}
    .bnav-row{display:flex}
    .bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:none;background:transparent;color:#6B7FA3;font-size:9px;font-weight:600;cursor:pointer;transition:color .15s}
    .bni.active{color:#00D4AA}
    .bni-icon{font-size:18px;line-height:1}

    /* Modal */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:500;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top,12px) 12px 80px}
    .mbox{background:#0F1520;border:1px solid #1E2D45;border-radius:16px;padding:18px;width:100%;max-width:480px;margin:0 auto;animation:fadeIn 0.2s ease}
    .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #1E2D45}

    /* Scrollbar */
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:#070B12}::-webkit-scrollbar-thumb{background:#1E2D45;border-radius:2px}

    @media(max-width:700px){
      .sidebar{display:none!important}
      .app-shell{display:block;height:100vh;overflow:hidden}
      .page-area{height:calc(100vh - 58px);overflow-y:auto;padding:14px 12px 16px}
      .bnav{display:block}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback}=React;

// ── Firebase ──────────────────────────────────────────────────────────────────
const FB={apiKey:"AIzaSyAO1cXrUg_8K-2xmmYQp03ggF_MnLWTF-I",projectId:"chitvault-55a6b"};
const AU=`https://identitytoolkit.googleapis.com/v1/accounts`;
const FU=`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
const fauth={
  async signIn(e,p){const r=await fetch(`${AU}:signInWithPassword?key=${FB.apiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});const d=await r.json();if(d.error)throw new Error(d.error.message);return d;},
  async createUser(e,p){const r=await fetch(`${AU}:signUp?key=${FB.apiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});const d=await r.json();if(d.error)throw new Error(d.error.message);return d;},
};
function toFS(o){const f={};for(const[k,v]of Object.entries(o)){if(v===null||v===undefined)f[k]={nullValue:null};else if(typeof v==="boolean")f[k]={booleanValue:v};else if(typeof v==="number")f[k]={integerValue:String(v)};else if(typeof v==="string")f[k]={stringValue:v};else if(Array.isArray(v))f[k]={arrayValue:{values:v.map(i=>({stringValue:String(i)}))}};else f[k]={stringValue:JSON.stringify(v)};}return{fields:f};}
function fromFS(doc){if(!doc.fields)return{};const o={_id:doc.name?.split("/").pop()};for(const[k,v]of Object.entries(doc.fields)){if(v.stringValue!==undefined)o[k]=v.stringValue;else if(v.integerValue!==undefined)o[k]=Number(v.integerValue);else if(v.doubleValue!==undefined)o[k]=Number(v.doubleValue);else if(v.booleanValue!==undefined)o[k]=v.booleanValue;else if(v.nullValue!==undefined)o[k]=null;else if(v.arrayValue)o[k]=(v.arrayValue.values||[]).map(i=>i.stringValue||"");else o[k]=null;}return o;}
const db={
  async getAll(col,tok){try{const r=await fetch(`${FU}/${col}`,{headers:{Authorization:`Bearer ${tok}`}});const d=await r.json();if(d.error)return[];return(d.documents||[]).map(fromFS);}catch{return[];}},
  async add(col,data,tok){const r=await fetch(`${FU}/${col}`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${tok}`},body:JSON.stringify(toFS(data))});const doc=await r.json();if(doc.error)throw new Error(doc.error.message);return fromFS(doc);},
  async update(col,id,data,tok){const r=await fetch(`${FU}/${col}/${id}`,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:`Bearer ${tok}`},body:JSON.stringify(toFS(data))});const doc=await r.json();if(doc.error)throw new Error(doc.error.message);return fromFS(doc);},
  async delete(col,id,tok){await fetch(`${FU}/${col}/${id}`,{method:"DELETE",headers:{Authorization:`Bearer ${tok}`}});},
};
const wa={
  send(ph,msg){const n=ph.replace(/\D/g,"");window.open(`https://wa.me/${n.startsWith("91")?n:"91"+n}?text=${encodeURIComponent(msg)}`,"_blank");},
  receipt:(m,g,a,r,d,mt)=>`✅ *ChitVault Receipt*\n📋 ${r}\n👤 ${m}\n💰 ${g}\n💵 ₹${Number(a).toLocaleString("en-IN")}\n📅 ${d} · ${mt}\n\nThank you! 🙏\n_ChitVault_`,
  due:(m,g,a,mo)=>`⏰ *Payment Reminder*\nDear ${m},\nYour ${g} payment of ₹${Number(a).toLocaleString("en-IN")} is due for ${mo}.\nPlease pay at the earliest.\n_ChitVault_`,
  lift:(m,g,amt,mo)=>`🎉 *Chit Lifted!*\nCongratulations ${m}!\nYou have won the auction for *${g}* in ${mo}.\nChit Amount: ₹${Number(amt).toLocaleString("en-IN")}\n_ChitVault_`,
};

// ── Design ────────────────────────────────────────────────────────────────────
const G={bg:"#070B12",surface:"#0F1520",card:"#141C2B",border:"#1E2D45",accent:"#00D4AA",accentS:"#00D4AA18",gold:"#F5B800",goldS:"#F5B80018",red:"#FF4757",redS:"#FF475718",blue:"#4B9EFF",blueS:"#4B9EFF18",purple:"#B44FFF",purpleS:"#B44FFF18",t1:"#E8EDF5",t2:"#6B7FA3",t3:"#2E3D55",wa:"#25D366"};

// ── Primitives ────────────────────────────────────────────────────────────────
const Spin=({s=20})=><div className="spin" style={{width:s,height:s,border:`2px solid ${G.border}`,borderTopColor:G.accent,borderRadius:"50%",flexShrink:0}}/>;
const Toast=({msg,type})=>msg?<div style={{position:"fixed",top:14,left:12,right:12,zIndex:9999,background:type==="success"?G.accent:G.red,color:type==="success"?"#000":"#fff",padding:"11px 16px",borderRadius:10,fontWeight:700,fontSize:13,textAlign:"center",boxShadow:"0 8px 28px rgba(0,0,0,0.5)"}}>{type==="success"?"✓ ":"✕ "}{msg}</div>:null;
const Card=({ch,s={},onClick,className})=><div onClick={onClick} className={className} style={{background:G.card,border:`1px solid ${G.border}`,borderRadius:13,padding:14,cursor:onClick?"pointer":"default",...s}}>{ch}</div>;

const Btn=({ch,onClick,v="primary",s={},sm,loading,disabled})=>{
  const base={border:"none",borderRadius:8,fontWeight:700,cursor:disabled||loading?"not-allowed":"pointer",transition:"all .15s",padding:sm?"6px 13px":"10px 18px",fontSize:sm?12:14,display:"inline-flex",alignItems:"center",justifyContent:"center",gap:5,opacity:disabled?0.5:1,flexShrink:0};
  const vs={primary:{background:G.accent,color:"#000"},ghost:{background:"transparent",color:G.t2,border:`1px solid ${G.border}`},danger:{background:G.redS,color:G.red,border:`1px solid ${G.red}44`},success:{background:G.accentS,color:G.accent,border:`1px solid ${G.accent}44`},wa:{background:"#25D36620",color:G.wa,border:"1px solid #25D36640"},gold:{background:G.goldS,color:G.gold,border:`1px solid ${G.gold}44`},purple:{background:G.purpleS,color:G.purple,border:`1px solid ${G.purple}44`}};
  return<button style={{...base,...vs[v],...s}} onClick={!disabled&&!loading?onClick:undefined}>{loading?<Spin s={13}/>:null}{ch}</button>;
};

const Inp=({label,val,set,type="text",ph,req,icon,small})=>(
  <div style={{marginBottom:small?9:12}}>
    {label&&<label style={{fontSize:11,color:G.t2,display:"block",marginBottom:4,fontWeight:600}}>{label}{req&&<span style={{color:G.accent}}> *</span>}</label>}
    <div style={{position:"relative"}}>
      {icon&&<span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:13}}>{icon}</span>}
      <input type={type} value={val} onChange={e=>set(e.target.value)} placeholder={ph}
        style={{width:"100%",background:G.surface,border:`1px solid ${G.border}`,borderRadius:8,padding:icon?"9px 11px 9px 32px":"9px 11px",color:G.t1,fontSize:13,transition:"border-color .2s"}}
        onFocus={e=>e.target.style.borderColor=G.accent} onBlur={e=>e.target.style.borderColor=G.border}/>
    </div>
  </div>
);

const Sel=({label,val,set,opts})=>(
  <div style={{marginBottom:12}}>
    {label&&<label style={{fontSize:11,color:G.t2,display:"block",marginBottom:4,fontWeight:600}}>{label}</label>}
    <select value={val} onChange={e=>set(e.target.value)} style={{width:"100%",background:G.surface,border:`1px solid ${G.border}`,borderRadius:8,padding:"9px 11px",color:G.t1,fontSize:13}}>
      {opts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
    </select>
  </div>
);

const Badge=({color,ch})=><span style={{background:`${color}22`,color,border:`1px solid ${color}33`,borderRadius:5,padding:"2px 8px",fontSize:10,fontWeight:700,whiteSpace:"nowrap"}}>{ch}</span>;

function Modal({open,onClose,title,ch}){
  useEffect(()=>{document.body.style.overflow=open?"hidden":"";return()=>{document.body.style.overflow="";};},[open]);
  if(!open)return null;
  return(
    <div className="overlay" onClick={onClose}>
      <div className="mbox" onClick={e=>e.stopPropagation()}>
        <div className="mhead">
          <span style={{fontSize:15,fontWeight:800}}>{title}</span>
          <button onClick={onClose} style={{background:G.card,border:`1px solid ${G.border}`,color:G.t2,width:27,height:27,borderRadius:7,cursor:"pointer",fontSize:15,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
        </div>
        {ch}
      </div>
    </div>
  );
}

function useOnline(){const[on,set]=useState(navigator.onLine);useEffect(()=>{window.addEventListener("online",()=>set(true));window.addEventListener("offline",()=>set(false));},[]);return on;}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const[u,setU]=useState(""),pw=useState(""),p=pw[0],sp=pw[1];
  const[err,setErr]=useState(""),l=useState(false),loading=l[0],setL=l[1];
  const toE=u=>`${u.toLowerCase().replace(/\s+/g,"")}@chitvault.app`;
  const go=async()=>{
    if(!u||!p){setErr("Enter username and password");return;}
    setL(true);setErr("");
    try{const d=await fauth.signIn(toE(u),p);onLogin({uid:d.localId,tok:d.idToken,username:u,isOwner:u.toLowerCase()==="harikrishna"});}
    catch(e){setErr(e.message.includes("INVALID")||e.message.includes("EMAIL")?"Invalid username or password":e.message);}
    setL(false);
  };
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:`radial-gradient(ellipse at 30% 50%,${G.accentS},transparent 60%),${G.bg}`,padding:20}}>
      <div style={{width:"100%",maxWidth:370,animation:"fadeIn .4s ease"}}>
        <div style={{textAlign:"center",marginBottom:26}}>
          <div style={{width:58,height:58,background:`linear-gradient(135deg,${G.accent},${G.blue})`,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 13px",fontSize:26}}>₹</div>
          <h1 style={{fontSize:24,fontWeight:800,letterSpacing:-1,background:`linear-gradient(135deg,${G.accent},${G.blue})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>ChitVault</h1>
          <p style={{color:G.t2,fontSize:12,marginTop:3}}>Chit Fund Management System</p>
        </div>
        <Card ch={<>
          <h2 style={{fontSize:14,fontWeight:800,marginBottom:16,color:G.t2}}>Sign In to Continue</h2>
          <Inp label="Username" val={u} set={setU} ph="Enter username" icon="👤" req/>
          <Inp label="Password" type="password" val={p} set={sp} ph="Enter password" icon="🔑" req/>
          {err&&<div style={{background:G.redS,border:`1px solid ${G.red}44`,borderRadius:8,padding:"9px 12px",marginBottom:11}}><p style={{color:G.red,fontSize:12}}>⚠ {err}</p></div>}
          <Btn ch={loading?"Signing In...":"Sign In →"} onClick={go} loading={loading} s={{width:"100%",padding:"12px",fontSize:14}}/>
        </>}/>
        <p style={{textAlign:"center",color:G.t3,fontSize:10,marginTop:12}}>Secured by Firebase Authentication</p>
      </div>
    </div>
  );
}

// ── NAV ───────────────────────────────────────────────────────────────────────
const NAV=[
  {id:"dashboard",icon:"⬡",label:"Dashboard"},
  {id:"groups",icon:"◈",label:"Groups"},
  {id:"members",icon:"◉",label:"Members"},
  {id:"collections",icon:"◎",label:"Collections"},
  {id:"receipts",icon:"▣",label:"Receipts"},
  {id:"reminders",icon:"💬",label:"WhatsApp"},
  {id:"reports",icon:"▤",label:"Reports"},
  {id:"users",icon:"🔐",label:"Users",ownerOnly:true},
];

function Sidebar({page,setPage,user,onLogout}){
  const nav=NAV.filter(n=>!n.ownerOnly||user?.isOwner);
  return(
    <div className="sidebar">
      <div style={{padding:"14px 16px",borderBottom:`1px solid ${G.border}`,display:"flex",alignItems:"center",gap:9}}>
        <div style={{width:28,height:28,background:`linear-gradient(135deg,${G.accent},${G.blue})`,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>₹</div>
        <span style={{fontWeight:800,fontSize:14,background:`linear-gradient(135deg,${G.accent},${G.blue})`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>ChitVault</span>
      </div>
      <nav style={{flex:1,padding:"8px 6px",overflowY:"auto"}}>
        {nav.map(n=>(
          <div key={n.id} onClick={()=>setPage(n.id)} style={{display:"flex",alignItems:"center",gap:9,padding:"9px 11px",borderRadius:8,marginBottom:2,cursor:"pointer",background:page===n.id?G.accentS:"transparent",color:page===n.id?G.accent:G.t2,fontWeight:page===n.id?700:500,fontSize:13,transition:"all .15s"}}>
            <span style={{fontSize:14}}>{n.icon}</span>{n.label}
          </div>
        ))}
      </nav>
      <div style={{padding:"11px 13px",borderTop:`1px solid ${G.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:9}}>
          <div style={{width:30,height:30,borderRadius:7,background:G.accentS,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,color:G.accent,fontSize:12,flexShrink:0}}>{user?.username?.[0]?.toUpperCase()}</div>
          <div style={{overflow:"hidden",flex:1}}><p style={{fontSize:12,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{user?.username}</p><p style={{fontSize:9,color:user?.isOwner?G.gold:G.t3}}>{user?.isOwner?"👑 Owner":"Staff"}</p></div>
        </div>
        <Btn ch="Sign Out" v="ghost" sm onClick={onLogout} s={{width:"100%"}}/>
      </div>
    </div>
  );
}

function BottomNav({page,setPage,user,onLogout}){
  const nav=NAV.filter(n=>!n.ownerOnly||user?.isOwner);
  const vis=nav.slice(0,4);
  const[more,setMore]=useState(false);
  return(
    <>
      <div className="bnav">
        <div className="bnav-row">
          {vis.map(n=>(
            <button key={n.id} className={`bni${page===n.id?" active":""}`} onClick={()=>setPage(n.id)}>
              <span className="bni-icon">{n.icon}</span><span>{n.label}</span>
            </button>
          ))}
          <button className={`bni${more?" active":""}`} onClick={()=>setMore(v=>!v)}>
            <span className="bni-icon">☰</span><span>More</span>
          </button>
        </div>
      </div>
      {more&&<>
        <div style={{position:"fixed",inset:0,zIndex:198}} onClick={()=>setMore(false)}/>
        <div style={{position:"fixed",bottom:58,left:0,right:0,zIndex:199,background:G.surface,borderTop:`1px solid ${G.border}`,padding:"6px 0",animation:"fadeIn .2s ease"}}>
          {nav.slice(4).map(n=>(
            <button key={n.id} onClick={()=>{setPage(n.id);setMore(false);}} style={{display:"flex",alignItems:"center",gap:13,width:"100%",padding:"12px 20px",border:"none",background:page===n.id?G.accentS:"transparent",color:page===n.id?G.accent:G.t2,fontSize:13,fontWeight:page===n.id?700:500,cursor:"pointer"}}>
              <span style={{fontSize:17}}>{n.icon}</span>{n.label}
            </button>
          ))}
          <div style={{borderTop:`1px solid ${G.border}`,margin:"5px 0"}}/>
          <div style={{display:"flex",alignItems:"center",gap:11,padding:"8px 20px"}}>
            <div style={{width:30,height:30,borderRadius:7,background:G.accentS,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,color:G.accent,fontSize:12}}>{user?.username?.[0]?.toUpperCase()}</div>
            <div style={{flex:1}}><p style={{fontSize:12,fontWeight:700}}>{user?.username}</p><p style={{fontSize:9,color:user?.isOwner?G.gold:G.t3}}>{user?.isOwner?"👑 Owner":"Staff"}</p></div>
            <Btn ch="Sign Out" sm v="ghost" onClick={onLogout}/>
          </div>
        </div>
      </>}
    </>
  );
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function Dashboard({groups,members,collections,setPage}){
  const today=new Date().toISOString().split("T")[0];
  const todayAmt=collections.filter(c=>c.date===today).reduce((a,c)=>a+Number(c.amount||0),0);
  const def=members.filter(m=>Number(m.pending||0)>0);
  const totalAmt=collections.reduce((a,c)=>a+Number(c.amount||0),0);
  return(
    <div className="fade">
      <div style={{marginBottom:16}}><h2 style={{fontSize:20,fontWeight:800}}>Dashboard</h2><p style={{color:G.t2,fontSize:12,marginTop:2}}>Welcome back, harikrishna 👋</p></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        {[
          ["Active Groups",groups.filter(g=>g.active==="true"||g.active===true).length,"◈",G.accent],
          ["Members",members.length,"◉",G.blue],
          ["Today's Collection",`₹${todayAmt.toLocaleString("en-IN")}`,"💰",G.accent],
          ["Total Collected",`₹${totalAmt.toLocaleString("en-IN")}`,"📊",G.gold],
          ["Defaulters",def.length,"⚠",G.red],
          ["Chit Auctions",collections.filter(c=>c.type==="lift").length,"🔨",G.purple],
        ].map(([l,v,ic,c])=>(
          <Card key={l} s={{position:"relative",overflow:"hidden",padding:13}} ch={<>
            <div style={{position:"absolute",right:-6,top:-6,width:50,height:50,background:`${c}14`,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{ic}</div>
            <p style={{fontSize:10,color:G.t2,fontWeight:700,letterSpacing:.5,marginBottom:5}}>{l.toUpperCase()}</p>
            <p style={{fontSize:20,fontWeight:800,color:c,fontFamily:"monospace"}}>{v}</p>
          </>}/>
        ))}
      </div>
      <Card s={{marginBottom:12}} ch={<>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:11}}>
          <h3 style={{fontWeight:700,fontSize:12,color:G.t2}}>CHIT GROUPS</h3>
          <Btn ch="View All" sm v="ghost" onClick={()=>setPage("groups")}/>
        </div>
        {groups.length===0&&<p style={{color:G.t3,fontSize:13}}>No groups yet.</p>}
        {groups.slice(0,3).map(g=>(
          <div key={g._id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:`1px solid ${G.border}`}}>
            <div><p style={{fontWeight:700,fontSize:13}}>{g.name}</p><p style={{color:G.t2,fontSize:11}}>₹{Number(g.amount||0).toLocaleString("en-IN")} × {g.duration}mo · {g.members} members</p></div>
            <Badge color={G.accent} ch="Active"/>
          </div>
        ))}
      </>}/>
      <Card ch={<>
        <h3 style={{fontWeight:700,fontSize:12,color:G.t2,marginBottom:11}}>DEFAULTERS</h3>
        {def.length===0&&<p style={{color:G.accent,fontSize:13}}>✓ No defaulters! All payments up to date.</p>}
        {def.map(m=>(
          <div key={m._id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:`1px solid ${G.border}`}}>
            <div><p style={{fontWeight:700,fontSize:13}}>{m.name}</p><p style={{color:G.t2,fontSize:11}}>{m.group} · {m.mobile}</p></div>
            <Badge color={G.red} ch={`${m.pending} due`}/>
          </div>
        ))}
      </>}/>
    </div>
  );
}

// ── GROUP DETAIL ──────────────────────────────────────────────────────────────
function GroupDetail({group,members,collections,onBack,idToken,showToast}){
  const gMembers=members.filter(m=>m.group===group.name);
  const gCollections=collections.filter(c=>c.group===group.name);
  const lifts=gCollections.filter(c=>c.type==="lift");
  const dur=Number(group.duration||20);
  const totalChit=Number(group.amount||0)*Number(group.members||0);

  // Month-by-month payment grid per member
  const getMemberMonths=(member)=>{
    const paid=gCollections.filter(c=>c.member===member.name&&c.type!=="lift").map(c=>Number(c.month||0));
    return Array.from({length:dur},(_,i)=>{
      const mo=i+1;
      if(paid.includes(mo))return"paid";
      return"pending";
    });
  };

  return(
    <div className="fade">
      <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:16}}>
        <button onClick={onBack} style={{background:G.card,border:`1px solid ${G.border}`,borderRadius:9,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:G.t2,fontSize:18}}>←</button>
        <div><h2 style={{fontSize:20,fontWeight:800}}>{group.name}</h2><p style={{color:G.t2,fontSize:12}}>Group Details</p></div>
      </div>

      {/* Summary cards */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:9,marginBottom:14}}>
        {[["Monthly",`₹${Number(group.amount||0).toLocaleString("en-IN")}`,G.accent],["Duration",`${group.duration}mo`,G.blue],["Members",gMembers.length,G.purple],["Total Chit",`₹${totalChit.toLocaleString("en-IN")}`,G.gold],["Collected",`₹${gCollections.filter(c=>c.type!=="lift").reduce((a,c)=>a+Number(c.amount||0),0).toLocaleString("en-IN")}`,G.accent],["Lifts",lifts.length,G.red]].map(([k,v,c])=>(
          <Card key={k} s={{padding:11,textAlign:"center"}} ch={<><p style={{fontSize:9,color:G.t3,marginBottom:4}}>{k}</p><p style={{fontSize:14,fontWeight:800,color:c,fontFamily:"monospace"}}>{v}</p></>}/>
        ))}
      </div>

      {/* Progress bar */}
      <Card s={{marginBottom:14,padding:14}} ch={<>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:7}}>
          <span style={{fontWeight:700,fontSize:12,color:G.t2}}>GROUP PROGRESS</span>
          <span style={{fontSize:12,color:G.accent,fontWeight:700}}>{lifts.length}/{dur} months</span>

        <div style={{height:8,background:G.border,borderRadius:4,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${dur>0?(lifts.length/dur)*100:0}%`,background:`linear-gradient(90deg,${G.accent},${G.blue})`,borderRadius:4,transition:"width .5s"}}/>
        </div>
        {lifts.length>0&&<div style={{marginTop:10}}>
          <p style={{fontSize:11,color:G.t2,fontWeight:600,marginBottom:6}}>AUCTION WINNERS</p>
          {lifts.map((l,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${G.border}`,fontSize:12}}>
              <span style={{fontWeight:700}}>Month {l.month}</span>
              <span style={{color:G.gold}}>🔨 {l.member}</span>
              <span style={{color:G.accent,fontFamily:"monospace"}}>₹{Number(l.amount||0).toLocaleString("en-IN")}</span>
            </div>
          ))}
        </div>}
      </>}/>

      {/* Members with payment status */}
      <h3 style={{fontWeight:700,fontSize:13,color:G.t2,marginBottom:10}}>MEMBERS & PAYMENT STATUS</h3>
      {gMembers.length===0&&<Card ch={<p style={{color:G.t3,textAlign:"center",fontSize:13}}>No members in this group yet</p>}/>}
      {gMembers.map(m=>{
        const months=getMemberMonths(m);
        const paidCount=months.filter(x=>x==="paid").length;
        return(
          <Card key={m._id} s={{marginBottom:10,padding:14}} ch={<>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <div style={{width:36,height:36,borderRadius:9,background:G.accentS,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,color:G.accent,flexShrink:0}}>{m.name?.[0]?.toUpperCase()}</div>
              <div style={{flex:1,minWidth:0}}>
                <p style={{fontWeight:700,fontSize:13}}>{m.name}</p>
                <p style={{fontSize:11,color:G.t2}}>{m.mobile}</p>
              </div>
              <div style={{textAlign:"right"}}>
                <p style={{fontSize:12,fontWeight:700,color:G.accent}}>{paidCount}/{dur}</p>
                <p style={{fontSize:10,color:G.t3}}>months paid</p>
              </div>
            </div>
            {/* Month bubbles */}
            <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
              {months.map((status,i)=>(

              <span style={{color:G.t3}}>Monthly: ₹{Number(m.monthlyAmount||group.amount||0).toLocaleString("en-IN")}</span>
            </div>
          </>}/>
        );
      })}
    </div>
  );
}

// ── GROUPS ────────────────────────────────────────────────────────────────────
function Groups({groups,setGroups,members,collections,idToken,showToast}){
  const[modal,setModal]=useState(false);
  const[liftModal,setLiftModal]=useState(null); // group for lift modal
  const[detail,setDetail]=useState(null);
  const[loading,setLoading]=useState(false);
  const[form,setForm]=useState({name:"",amount:"",duration:"",members:"",start:"",end:""});
  const[liftForm,setLiftForm]=useState({member:"",month:"",amount:"",date:new Date().toISOString().split("T")[0]});
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const add=async()=>{
    if(!form.name||!form.amount){showToast("Name and amount required","error");return;}
    setLoading(true);
    try{const doc=await db.add("groups",{...form,active:"true",collected:"0",createdAt:new Date().toISOString()},idToken);setGroups(p=>[...p,doc]);setModal(false);setForm({name:"",amount:"",duration:"",members:"",start:"",end:""});showToast("Group created!");}
    catch(e){showToast(e.message,"error");}
    setLoading(false);
  };

  const recordLift=async()=>{
    if(!liftForm.member||!liftForm.month){showToast("Select member and month","error");return;}
    setLoading(true);
    try{
      const gMembers=members.filter(m=>m.group===liftModal.name);
      const winner=gMembers.find(m=>m.name===liftForm.member);
      const liftAmt=liftForm.amount||liftModal.amount;
      await db.add("collections",{
        member:liftForm.member,group:liftModal.name,amount:String(liftAmt),
        month:liftForm.month,date:liftForm.date,method:"Auction",
        type:"lift",receipt:`LIFT-${liftModal.name}-M${liftForm.month}`,
        mobile:winner?.mobile||"",createdAt:new Date().toISOString()
      },idToken);
      if(winner?.mobile){
        const mo=`Month ${liftForm.month}`;
        setTimeout(()=>wa.send(winner.mobile,wa.lift(winner.name,liftModal.name,liftAmt,mo)),400);
      }
      showToast(`🔨 ${liftForm.member} lifted Month ${liftForm.month}!`);
      setLiftModal(null);setLiftForm({member:"",month:"",amount:"",date:new Date().toISOString().split("T")[0]});
    }catch(e){showToast(e.message,"error");}
    setLoading(false);
  };

  if(detail){
    return<GroupDetail group={detail} members={members} collections={collections} onBack={()=>setDetail(null)} idToken={idToken} showToast={showToast}/>;
  }

  return(
    <div className="fade">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div><h2 style={{fontSize:20,fontWeight:800}}>Chit Groups</h2><p style={{color:G.t2,fontSize:12}}>Tap a group to see details</p></div>
        <Btn ch="+ New" onClick={()=>setModal(true)}/>
      </div>
      {groups.length===0&&<Card s={{textAlign:"center",padding:36}} ch={<><p style={{fontSize:32,marginBottom:8}}>◈</p><p style={{color:G.t2}}>No chit groups yet</p></>}/>}
      {groups.map(g=>{
        const gM=members.filter(m=>m.group===g.name).length;
        const gC=collections.filter(c=>c.group===g.name&&c.type!=="lift");
        const lifts=collections.filter(c=>c.group===g.name&&c.type==="lift").length;
        const totalCollected=gC.reduce((a,c)=>a+Number(c.amount||0),0);
        const totalTarget=Number(g.amount||0)*Number(g.duration||0)*Number(g.members||gM||1);
        const pct=totalTarget>0?Math.min(100,(totalCollected/totalTarget)*100):0;
        return(
          <Card key={g._id} s={{marginBottom:12,cursor:"pointer"}} onClick={()=>setDetail(g)} ch={<>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div>
                <p style={{fontWeight:800,fontSize:15}}>{g.name}</p>
                <p style={{color:G.t2,fontSize:11,marginTop:2}}>₹{Number(g.amount||0).toLocaleString("en-IN")}/mo · {g.duration}mo · {gM} members</p>
              </div>
              <Badge color={G.accent} ch="Active"/>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
              <div style={{background:G.surface,borderRadius:7,padding:"7px 9px"}}><p style={{fontSize:9,color:G.t3,marginBottom:2}}>COLLECTED</p><p style={{fontSize:12,fontWeight:700,color:G.accent,fontFamily:"monospace"}}>₹{totalCollected.toLocaleString("en-IN")}</p></div>
              <div style={{background:G.surface,borderRadius:7,padding:"7px 9px"}}><p style={{fontSize:9,color:G.t3,marginBottom:2}}>LIFTS</p><p style={{fontSize:12,fontWeight:700,color:G.gold,fontFamily:"monospace"}}>🔨 {lifts}/{g.duration}</p></div>
              <div style={{background:G.surface,borderRadius:7,padding:"7px 9px"}}><p style={{fontSize:9,color:G.t3,marginBottom:2}}>MEMBERS</p><p style={{fontSize:12,fontWeight:700,color:G.blue,fontFamily:"monospace"}}>{gM}</p></div>
            </div>
            <div style={{fontSize:10,color:G.t2,display:"flex",justifyContent:"space-between",marginBottom:4}}><span>{g.start||"—"} → {g.end||"—"}</span><span>{pct.toFixed(0)}%</span></div>
            <div style={{height:5,background:G.border,borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${G.accent},${G.blue})`,borderRadius:2}}/></div>
            <div style={{marginTop:10,display:"flex",gap:8}} onClick={e=>e.stopPropagation()}>
              <Btn ch="🔨 Record Lift" sm v="gold" onClick={e=>{e.stopPropagation();setLiftModal(g);setLiftForm({member:"",month:"",amount:g.amount,date:new Date().toISOString().split("T")[0]});}} s={{flex:1}}/>
              <Btn ch="View Details →" sm v="ghost" onClick={e=>{e.stopPropagation();setDetail(g);}} s={{flex:1}}/>
            </div>
          </>}/>
        );
      })}

      {/* New Group Modal */}
      <Modal open={modal} onClose={()=>setModal(false)} title="Create Chit Group" ch={<>
        <Inp label="Chit Name *" val={form.name} set={v=>f("name",v)} ph="e.g. Gold Chit A"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
          <Inp label="Monthly Amount (₹) *" type="number" val={form.amount} set={v=>f("amount",v)} ph="5000"/>
          <Inp label="Duration (months)" type="number" val={form.duration} set={v=>f("duration",v)} ph="20"/>
        </div>
        <Inp label="Number of Members" type="number" val={form.members} set={v=>f("members",v)} ph="20"/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
          <Inp label="Start Date" type="date" val={form.start} set={v=>f("start",v)}/>
          <Inp label="End Date" type="date" val={form.end} set={v=>f("end",v)}/>
        </div>
        <div style={{display:"flex",gap:8,marginTop:4}}>
          <Btn ch="Create Group" onClick={add} loading={loading} s={{flex:1}}/>
          <Btn ch="Cancel" v="ghost" onClick={()=>setModal(false)} s={{flex:1}}/>
        </div>
      </>}/>

      {/* Lift Modal */}
      <Modal open={!!liftModal} onClose={()=>setLiftModal(null)} title={`🔨 Record Chit Lift — ${liftModal?.name}`} ch={liftModal&&<>
        <div style={{background:G.goldS,border:`1px solid ${G.gold}33`,borderRadius:9,padding:"10px 13px",marginBottom:12,fontSize:12,color:G.gold}}>
          🔨 Record which member lifted (won) the auction this month. WhatsApp congratulations will be sent automatically.
        </div>
        <Sel label="Winner Member *" val={liftForm.member} set={v=>setLiftForm(p=>({...p,member:v}))} opts={[{v:"",l:"Select winner"},...members.filter(m=>m.group===liftModal.name).map(m=>({v:m.name,l:`${m.name} — ${m.mobile}`}))]}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
          <Inp label="Month Number *" type="number" val={liftForm.month} set={v=>setLiftForm(p=>({...p,month:v}))} ph={`1-${liftModal.duration}`}/>
          <Inp label="Lift Amount (₹)" type="number" val={liftForm.amount} set={v=>setLiftForm(p=>({...p,amount:v}))} ph={liftModal.amount}/>
        </div>
        <Inp label="Date" type="date" val={liftForm.date} set={v=>setLiftForm(p=>({...p,date:v}))}/>
        <div style={{display:"flex",gap:8,marginTop:4}}>
          <Btn ch="🔨 Record Lift + WhatsApp" onClick={recordLift} loading={loading} v="gold" s={{flex:1}}/>
          <Btn ch="Cancel" v="ghost" onClick={()=>setLiftModal(null)} s={{flex:1}}/>
        </div>
      </>}/>
    </div>
  );
}

// ── MEMBERS ───────────────────────────────────────────────────────────────────
function Members({members,setMembers,groups,collections,idToken,showToast}){
  const[modal,setModal]=useState(false);
  const[search,setSearch]=useState("");
  const[loading,setLoading]=useState(false);
  const today=new Date().toISOString().split("T")[0];
  const[form,setForm]=useState({name:"",mobile:"",address:"",aadhaar:"",pan:"",nominee:"",joining:today,group:"",monthlyAmount:""});
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const filtered=members.filter(m=>
    m.name?.toLowerCase().includes(search.toLowerCase())||
    m.mobile?.includes(search)||
    m.group?.toLowerCase().includes(search.toLowerCase())
  );

  const add=async()=>{
    if(!form.name||!form.mobile){showToast("Name and mobile required","error");return;}
    setLoading(true);
    try{
      const doc=await db.add("members",{...form,paid:"0",pending:"0",status:"active",createdAt:new Date().toISOString()},idToken);
      setMembers(p=>[...p,doc]);setModal(false);
      setForm({name:"",mobile:"",address:"",aadhaar:"",pan:"",nominee:"",joining:today,group:"",monthlyAmount:""});
      showToast(`${form.name} added!`);
    }catch(e){showToast(e.message,"error");}
    setLoading(false);
  };

  // Compute live paid/pending from collections
  const getMemberStats=(m)=>{
    const mCols=collections.filter(c=>c.member===m.name&&c.group===m.group&&c.type!=="lift");
    const g=groups.find(x=>x.name===m.group);
    const dur=Number(g?.duration||0);
    const paidMonths=new Set(mCols.map(c=>Number(c.month)).filter(Boolean));
    // If month not tracked, count by records
    const paidCount=paidMonths.size||mCols.length;
    const pending=Math.max(0,dur-paidCount);
    return{paidCount,pending,dur};
  };

  return(
    <div className="fade">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div><h2 style={{fontSize:20,fontWeight:800}}>Members</h2><p style={{color:G.t2,fontSize:12}}>{members.length} enrolled</p></div>
        <Btn ch="+ Add" onClick={()=>setModal(true)}/>
      </div>
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search name, mobile, group..."
        style={{width:"100%",background:G.card,border:`1px solid ${G.border}`,borderRadius:9,padding:"9px 13px",color:G.t1,fontSize:13,marginBottom:12}}/>
      {filtered.length===0&&<Card ch={<p style={{color:G.t3,textAlign:"center",fontSize:13}}>No members found</p>}/>}
      {filtered.map(m=>{
        const {paidCount,pending,dur}=getMemberStats(m);
        const pct=dur>0?(paidCount/dur)*100:0;
        const isDefault=pending>0;
        return(
          <Card key={m._id} s={{marginBottom:10,padding:13}} ch={<>
            <div style={{display:"flex",alignItems:"center",gap:11}}>
              <div style={{width:40,height:40,borderRadius:10,background:G.accentS,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:16,color:G.accent,flexShrink:0}}>{m.name?.[0]?.toUpperCase()}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                  <p style={{fontWeight:700,fontSize:14}}>{m.name}</p>
                  <Badge color={isDefault?G.red:G.accent} ch={isDefault?"Defaulter":"Active"}/>
                </div>
                <p style={{fontSize:11,color:G.t2,marginTop:2}}>{m.mobile} · {m.group}</p>
                <div style={{display:"flex",gap:12,marginTop:3}}>
                  <span style={{fontSize:11,color:G.accent,fontWeight:700}}>Paid: {paidCount}/{dur}</span>
                  <span style={{fontSize:11,color:isDefault?G.red:G.t3,fontWeight:700}}>Due: {pending}</span>
                  {m.monthlyAmount&&<span style={{fontSize:11,color:G.t3}}>₹{Number(m.monthlyAmount).toLocaleString("en-IN")}/mo</span>}
                </div>
              </div>
              <Btn ch="💬" sm v="wa" onClick={()=>wa.send(m.mobile,wa.due(m.name,m.group,m.monthlyAmount||5000,new Date().toLocaleString("en-IN",{month:"long",year:"numeric"})))}/>
            </div>
            {dur>0&&<>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:G.t2,marginTop:9,marginBottom:4}}><span>Payment progress</span><span>{pct.toFixed(0)}%</span></div>
              <div style={{height:4,background:G.border,borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${G.accent},${G.blue})`,borderRadius:2}}/></div>
            </>}
          </>}/>
        );
      })}

      <Modal open={modal} onClose={()=>setModal(false)} title="Add New Member" ch={<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
          <Inp label="Full Name *" val={form.name} set={v=>f("name",v)}/>
          <Inp label="Mobile *" val={form.mobile} set={v=>f("mobile",v)} ph="9XXXXXXXXX"/>
        </div>
        <Inp label="Address" val={form.address} set={v=>f("address",v)}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
          <Inp label="Aadhaar" val={form.aadhaar} set={v=>f("aadhaar",v)}/>
          <Inp label="PAN" val={form.pan} set={v=>f("pan",v)}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
          <Inp label="Nominee" val={form.nominee} set={v=>f("nominee",v)}/>
          <Inp label="Joining Date" type="date" val={form.joining} set={v=>f("joining",v)}/>
        </div>
        <Sel label="Chit Group" val={form.group} set={v=>{const g=groups.find(x=>x.name===v);f("group",v);if(g)f("monthlyAmount",g.amount);}} opts={[{v:"",l:"Select group"},...groups.map(g=>({v:g.name,l:`${g.name} (₹${Number(g.amount).toLocaleString("en-IN")})`}))]}/>
        <div style={{display:"flex",gap:8,marginTop:4}}>
          <Btn ch="Add Member" onClick={add} loading={loading} s={{flex:1}}/>
          <Btn ch="Cancel" v="ghost" onClick={()=>setModal(false)} s={{flex:1}}/>
        </div>
      </>}/>
    </div>
  );
}

// ── COLLECTIONS ───────────────────────────────────────────────────────────────
function Collections({collections,setCollections,members,groups,idToken,showToast}){
  const[modal,setModal]=useState(false);
  const[loading,setLoading]=useState(false);
  const today=new Date().toISOString().split("T")[0];
  const[form,setForm]=useState({member:"",mobile:"",group:"",amount:"",month:"",date:today,method:"Cash"});
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  const add=async()=>{
    if(!form.member||!form.amount){showToast("Member and amount required","error");return;}
    setLoading(true);
    try{
      const rno=`RCP-${String(collections.filter(c=>c.type!=="lift").length+1).padStart(4,"0")}`;
      const doc=await db.add("collections",{...form,type:"payment",receipt:rno,createdAt:new Date().toISOString()},idToken);
      setCollections(p=>[doc,...p]);setModal(false);
      showToast(`Recorded! ${rno}`);
      if(form.mobile)setTimeout(()=>wa.send(form.mobile,wa.receipt(form.member,form.group,form.amount,rno,form.date,form.method)),400);
      setForm({member:"",mobile:"",group:"",amount:"",month:"",date:today,method:"Cash"});
    }catch(e){showToast(e.message,"error");}
    setLoading(false);
  };

  const payments=collections.filter(c=>c.type!=="lift");
  const total=payments.reduce((a,c)=>a+Number(c.amount||0),0);

  return(
    <div className="fade">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div><h2 style={{fontSize:20,fontWeight:800}}>Collections</h2><p style={{color:G.t2,fontSize:12}}>Total: <span style={{color:G.accent,fontWeight:700}}>₹{total.toLocaleString("en-IN")}</span></p></div>
        <Btn ch="+ Record" onClick={()=>setModal(true)}/>
      </div>
      {payments.length===0&&<Card ch={<p style={{color:G.t3,textAlign:"center",fontSize:13}}>No payments recorded yet</p>}/>}
      {payments.map(c=>(

function WAReminders({members,showToast}){
  const[log,setLog]=useState([]);

    const key=`${type}-${m._id}`;setLoading(key);
    const mo=new Date().toLocaleString("en-IN",{month:"long",year:"numeric"});
    const msgs={
      due:wa.due(m.name,m.group,m.monthlyAmount||5000,mo),
      overdue:`🚨 *Overdue Alert*\nDear ${m.name},\nYou have ${m.pending} months overdue for ${m.group}.\nTotal: ₹${(Number(m.pending)*Number(m.monthlyAmount||5000)).toLocaleString("en-IN")}\nPlease contact us.\n_ChitVault_`,
      auction:`🔔 *Auction Notice*\nDear ${m.name},\nThe auction for ${m.group} is scheduled soon.\nPlease be present.\n_ChitVault_`,

        <h3 style={{fontWeight:700,fontSize:12,marginBottom:12,color:G.t2}}>SEND TO INDIVIDUAL</h3>
        {members.length===0&&<p style={{color:G.t3,fontSize:13}}>No members yet</p>}

}

function UserManager({idToken,showToast}){
  const[users,setUsers]=useState([]);
  const[modal,setModal]=useState(false);
  const[loading,setLoading]=useState(false);
  const[fetching,setFetching]=useState(true);
  const[form,setForm]=useState({username:"",password:"",role:"collector",mobile:""});
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  useEffect(()=>{db.getAll("app_users",idToken).then(d=>{setUsers(d);setFetching(false);});},[idToken]);
  const toE=u=>`${u.toLowerCase().replace(/\s+/g,"")}@chitvault.app`;
  const create=async()=>{
    if(!form.username||!form.password){showToast("Username and password required","error");return;}
    if(form.password.length<6){showToast("Password min 6 characters","error");return;}
    setLoading(true);
    try{
      await fauth.createUser(toE(form.username),form.password);
      const doc=await db.add("app_users",{username:form.username,email:toE(form.username),role:form.role,mobile:form.mobile,createdAt:new Date().toISOString(),active:"true"},idToken);
      setUsers(p=>[...p,doc]);setModal(false);setForm({username:"",password:"",role:"collector",mobile:""});showToast(`User ${form.username} created!`);
    }catch(e){showToast(e.message.includes("EMAIL_EXISTS")?"Username already taken":e.message,"error");}

    <div className="fade">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>

        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <Card s={{padding:"13px 14px",background:G.goldS}} ch={<div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:34,height:34,borderRadius:8,background:`${G.gold}22`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,color:G.gold}}>H</div>
            <div style={{flex:1}}><p style={{fontWeight:700,fontSize:13}}>harikrishna</p><p style={{fontSize:10,color:G.t3}}>harikrishna@chitvault.app</p></div>
            <Badge color={G.gold} ch="👑 Owner"/>
          </div>}/>
          {users.length===0&&<Card ch={<p style={{color:G.t3,textAlign:"center",fontSize:13}}>No staff users yet</p>}/>}
          {users.map(u=>(
            <Card key={u._id} s={{padding:"13px 14px"}} ch={<div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:34,height:34,borderRadius:8,background:G.accentS,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,color:G.accent}}>{u.username?.[0]?.toUpperCase()}</div>
              <div style={{flex:1,minWidth:0}}><p style={{fontWeight:700,fontSize:13}}>{u.username}</p><p style={{fontSize:10,color:G.t2}}>{u.email}</p></div>
              <div style={{display:"flex",alignItems:"center",gap:6}}><Badge color={u.role==="manager"?G.purple:G.blue} ch={u.role}/><Btn ch="✕" sm v="danger" onClick={()=>del(u)}/></div>

// ── IMPORT HUB ────────────────────────────────────────────────────────────────
function ImportHub({open,onClose,groups,setGroups,members,setMembers,idToken,showToast}){
  const[tab,setTab]=useState("excel");
  const[preview,setPreview]=useState(null);
  const[importing,setImporting]=useState(false);
  const[image,setImage]=useState(null);
  const[imgB64,setImgB64]=useState(null);
  const[aiResult,setAiResult]=useState(null);
  const[aiLoading,setAiLoading]=useState(false);
  const fileRef=useRef();
  const imgRef=useRef();

  const parseXLSX=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:"array"});
        const result={groups:[],members:[]};
        wb.SheetNames.forEach(name=>{
          const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:""});
          if(!rows.length)return;
          const keys=Object.keys(rows[0]).map(k=>k.toLowerCase());
          if(keys.some(k=>k.includes("group")||k.includes("chit")||k.includes("scheme"))){
            rows.forEach(r=>{const v=Object.values(r);result.groups.push({name:String(v[0]||"").trim(),amount:String(v[1]||"").trim(),duration:String(v[2]||"").trim(),members:String(v[3]||"").trim(),start:String(v[4]||"").trim(),end:String(v[5]||"").trim()});});
          } else {
            rows.forEach(r=>{const v=Object.values(r);result.members.push({name:String(v[0]||"").trim(),mobile:String(v[1]||"").trim(),group:String(v[2]||"").trim(),monthlyAmount:String(v[3]||"").trim(),paid:String(v[4]||"0").trim(),pending:String(v[5]||"0").trim(),address:String(v[6]||"").trim()});});
          }
        });
        setPreview(result);
      }catch(e){showToast("Could not read — use .xlsx format","error");}
    };
    reader.readAsArrayBuffer(file);
  };

  const doImport=async(data)=>{
    setImporting(true);let gC=0,mC=0;
    try{
      for(const g of(data.groups||[]).filter(x=>x.name)){const doc=await db.add("groups",{...g,active:"true",collected:"0",createdAt:new Date().toISOString()},idToken);setGroups(p=>[...p,doc]);gC++;}
      for(const m of(data.members||[]).filter(x=>x.name)){const doc=await db.add("members",{...m,status:"active",joining:new Date().toISOString().split("T")[0],createdAt:new Date().toISOString()},idToken);setMembers(p=>[...p,doc]);mC++;}
      showToast(`Imported ${gC} groups, ${mC} members!`);onClose();
    }catch(e){showToast(e.message,"error");}
    setImporting(false);
  };

  const onPhoto=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{setImage(ev.target.result);setImgB64(ev.target.result.split(",")[1]);setAiResult(null);};r.readAsDataURL(file);};

  const analyzePhoto=async()=>{
    if(!imgB64)return;setAiLoading(true);setAiResult(null);
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:imgB64}},{type:"text",text:`Extract chit fund data from this image. Return ONLY valid JSON, no markdown:\n{"groups":[{"name":"","amount":"","duration":"","members":"","start":"","end":""}],"members":[{"name":"","mobile":"","group":"","monthlyAmount":"","paid":"0","pending":"0","address":""}],"notes":""}\nExtract every name, number, amount, date visible.`}]}]})});
      const data=await res.json();
      const text=data.content?.find(c=>c.type==="text")?.text||"{}";
      setAiResult(JSON.parse(text.replace(/```json|```/g,"").trim()));
    }catch(e){showToast("Could not read photo — try a clearer image","error");}
    setAiLoading(false);
  };

  return(
    <Modal open={open} onClose={onClose} title="📥 Import Data" ch={<>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        {["excel","photo"].map(t=><button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:"9px",border:`1px solid ${tab===t?(t==="excel"?G.accent:G.purple):G.border}`,borderRadius:8,background:tab===t?(t==="excel"?G.accentS:G.purpleS):"transparent",color:tab===t?(t==="excel"?G.accent:G.purple):G.t2,fontWeight:700,cursor:"pointer",fontSize:13}}>{t==="excel"?"📊 Excel":"📸 Photo"}</button>)}
      </div>
      {tab==="excel"&&<>
        <div style={{background:G.accentS,border:`1px solid ${G.accent}33`,borderRadius:9,padding:11,marginBottom:12,fontSize:11,color:G.accent}}>
          <b>Excel Format:</b><br/>Sheet 1 — Groups: Name | Amount | Duration | Members | Start | End<br/>Sheet 2 — Members: Name | Mobile | Group | Amount | Paid | Pending
        </div>
        <div onClick={()=>fileRef.current.click()} style={{border:`2px dashed ${G.accent}55`,borderRadius:11,padding:24,textAlign:"center",cursor:"pointer",marginBottom:12,background:G.accentS}}>
          <div style={{fontSize:28,marginBottom:6}}>📊</div>
          <p style={{fontWeight:700,fontSize:13,color:G.accent}}>Tap to choose Excel file</p>
          <p style={{fontSize:11,color:G.t2,marginTop:3}}>.xlsx or .xls</p>
          <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={parseXLSX} style={{display:"none"}}/>
        </div>
        {preview&&<>
          <div style={{background:G.card,borderRadius:9,padding:11,marginBottom:11}}>
            <p style={{fontWeight:700,fontSize:12,marginBottom:8}}>📋 Preview</p>
            <div style={{display:"flex",gap:10}}>
              <div style={{flex:1,background:G.surface,borderRadius:7,padding:8,textAlign:"center"}}><p style={{fontSize:18,fontWeight:800,color:G.accent}}>{preview.groups.length}</p><p style={{fontSize:10,color:G.t3}}>Groups</p></div>
              <div style={{flex:1,background:G.surface,borderRadius:7,padding:8,textAlign:"center"}}><p style={{fontSize:18,fontWeight:800,color:G.blue}}>{preview.members.length}</p><p style={{fontSize:10,color:G.t3}}>Members</p></div>
            </div>
          </div>
          <Btn ch="⬆ Import to App" onClick={()=>doImport(preview)} loading={importing} s={{width:"100%"}}/>
        </>}
      </>}
      {tab==="photo"&&<>
        <div style={{background:G.purpleS,border:`1px solid ${G.purple}44`,borderRadius:9,padding:11,marginBottom:12,fontSize:11,color:G.purple}}>
          📸 Take a photo of your handwritten chit book — AI reads all names, amounts, and dates automatically.
        </div>
        <div onClick={()=>imgRef.current.click()} style={{border:`2px dashed ${G.purple}55`,borderRadius:11,padding:image?6:24,textAlign:"center",cursor:"pointer",marginBottom:11,background:G.purpleS,overflow:"hidden"}}>
          {image?<img src={image} style={{width:"100%",borderRadius:8,maxHeight:180,objectFit:"cover"}} alt="notes"/>:<>
            <div style={{fontSize:28,marginBottom:6}}>📷</div>
            <p style={{fontWeight:700,fontSize:13,color:G.purple}}>Tap to take photo</p>
            <p style={{fontSize:11,color:G.t2,marginTop:3}}>Handwritten ledger, notebook</p>
          </>}
          <input ref={imgRef} type="file" accept="image/*" capture="environment" onChange={onPhoto} style={{display:"none"}}/>
        </div>
        {image&&!aiResult&&<Btn ch={aiLoading?"🔍 Reading...":"🔍 Read with AI"} onClick={analyzePhoto} loading={aiLoading} v="purple" s={{width:"100%",marginBottom:10}}/>}
        {aiResult&&<>
          <div style={{background:G.card,borderRadius:9,padding:11,marginBottom:11}}>
            <p style={{fontWeight:700,fontSize:12,marginBottom:8,color:G.accent}}>✓ AI detected:</p>
            <div style={{display:"flex",gap:9}}>
              <div style={{flex:1,background:G.surface,borderRadius:7,padding:8,textAlign:"center"}}><p style={{fontSize:16,fontWeight:800,color:G.accent}}>{(aiResult.groups||[]).length}</p><p style={{fontSize:10,color:G.t3}}>Groups</p></div>
              <div style={{flex:1,background:G.surface,borderRadius:7,padding:8,textAlign:"center"}}><p style={{fontSize:16,fontWeight:800,color:G.blue}}>{(aiResult.members||[]).length}</p><p style={{fontSize:10,color:G.t3}}>Members</p></div>
            </div>
            {(aiResult.members||[]).slice(0,4).map((m,i)=><p key={i} style={{fontSize:11,color:G.t2,marginTop:3}}>◉ {m.name}{m.mobile?` — ${m.mobile}`:""}</p>)}
          </div>
          <div style={{display:"flex",gap:8}}>
            <Btn ch="📷 Retake" v="ghost" onClick={()=>{setImage(null);setAiResult(null);}} s={{flex:1}}/>
            <Btn ch="⬆ Import All" onClick={()=>doImport(aiResult)} loading={importing} s={{flex:1}}/>
          </div>
        </>}
      </>}
    </>}/>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[page,setPage]=useState("dashboard");
  const[groups,setGroups]=useState([]);
  const[members,setMembers]=useState([]);
  const[collections,setCollections]=useState([]);
  const[dataLoading,setDataLoading]=useState(false);
  const[toast,setToast]=useState({msg:"",type:"success"});
  const[importOpen,setImportOpen]=useState(false);
  const isOnline=useOnline();
  const showToast=useCallback((msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"success"}),3200);},[]);

  const onLogin=async u=>{
    setUser(u);setDataLoading(true);
    try{
      const[g,m,c]=await Promise.all([db.getAll("groups",u.tok),db.getAll("members",u.tok),db.getAll("collections",u.tok)]);
      setGroups(g);setMembers(m);setCollections(c.sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")));
    }catch(e){showToast("Could not load data","error");}
    setDataLoading(false);
  };

  if(!user)return<Login onLogin={onLogin}/>;
  const sp={idToken:user.tok,showToast};
  const pages={
    dashboard:<Dashboard groups={groups} members={members} collections={collections} setPage={setPage}/>,
    groups:<Groups groups={groups} setGroups={setGroups} members={members} collections={collections} {...sp}/>,
    members:<Members members={members} setMembers={setMembers} groups={groups} collections={collections} {...sp}/>,
    collections:<Collections collections={collections} setCollections={setCollections} members={members} groups={groups} {...sp}/>,
    receipts:<Receipts collections={collections} showToast={showToast}/>,
    reminders:<WAReminders members={members} showToast={showToast}/>,
    reports:<Reports groups={groups} members={members} collections={collections}/>,
    users:<UserManager {...sp}/>,
  };

  return(
    <>
      <Toast msg={toast.msg} type={toast.type}/>
      {!isOnline&&<div style={{position:"fixed",top:0,left:0,right:0,zIndex:9998,background:G.red,color:"#fff",textAlign:"center",padding:"6px",fontSize:12,fontWeight:700}}>⚠ Offline — sync paused</div>}
      <div className="app-shell">
        <Sidebar page={page} setPage={setPage} user={user} onLogout={()=>setUser(null)}/>
        <div className="page-area">
          <div style={{maxWidth:800,margin:"0 auto"}}>
            <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
              <Btn ch="📥 Import" sm v="gold" onClick={()=>setImportOpen(true)}/>
            </div>
            {dataLoading?(
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"50vh",gap:13}}>
                <Spin s={34}/><p style={{color:G.t2}}>Loading from Firebase...</p>
              </div>
            ):pages[page]}
          </div>
        </div>
      </div>
      <BottomNav page={page} setPage={setPage} user={user} onLogout={()=>setUser(null)}/>
      <ImportHub open={importOpen} onClose={()=>setImportOpen(false)} groups={groups} setGroups={setGroups} members={members} setMembers={setMembers} idToken={user.tok} showToast={showToast}/>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
